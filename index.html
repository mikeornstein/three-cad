<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-cad</title>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <aside id="build-tree" class="is-collapsed" aria-label="Build tree"></aside>
      <div id="toolbar">
        <button
          type="button"
          id="selection-filter"
          data-filter="all"
          title="Cycle selection filter: all / solid / face / edge / vertex (F)"
        >
          All
        </button>
      </div>
      <div
        id="console"
        class="is-collapsed"
        aria-label="Selection console"
        aria-live="polite"
      >
        <pre id="console-log" class="console-log"></pre>
      </div>
      <div id="measure-bar" aria-label="Selection measures">
        <div class="measure-bar-title">No selection</div>
        <div class="measure-bar-fields"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
